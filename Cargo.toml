[package]
name = "rustgrad"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
libffi = "5.1.0"
libloading = "0.8"
tempfile = "3"
thiserror = "2"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# We use C FFI heavily, unsafe is expected
missing_safety_doc = "allow"

[lints.rust]
missing_docs = "warn"
